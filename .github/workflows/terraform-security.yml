---
name: Terraform Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  tfsec:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          format: sarif
          sarif_file: tfsec-results.sarif
          additional_args: --verbose --include-ignored

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif

  tfsec-pr-commenter:
    runs-on: ubuntu-latest
    name: Security Comments
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: tfsec PR commenter
        uses: aquasecurity/tfsec-pr-commenter-action@v1.3.1
        with:
          github_token: ${{ github.token }}

  summary:
    needs: [tfsec]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security Summary
        run: |
          echo "## 🔒 Terraform Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TFSEC_RESULT="${{ needs.tfsec.result }}"

          if [ "$TFSEC_RESULT" = "success" ]; then
            echo "✅ **Security scan completed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the SARIF results below for any security findings." \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security scan failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The tfsec scan encountered an error. Check the logs above." \
              >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **SARIF results uploaded to GitHub Security tab**" \
            >> $GITHUB_STEP_SUMMARY
