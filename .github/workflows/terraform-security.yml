---
name: Terraform Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  tfsec:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false
          format: sarif
          additional_args: --verbose --include-ignored

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec.sarif

  tfsec-pr-commenter:
    runs-on: ubuntu-latest
    name: Security Comments
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: tfsec PR commenter
        uses: aquasecurity/tfsec-pr-commenter-action@v1.3.1
        with:
          github_token: ${{ github.token }}

  summary:
    needs: [tfsec]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security Summary
        run: |
          echo "## 🔒 Terraform Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TFSEC_RESULT="${{ needs.tfsec.result }}"

          if [ "$TFSEC_RESULT" = "success" ]; then
            echo "✅ **No security issues found**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All Terraform configurations passed security checks." \
              >> $GITHUB_STEP_SUMMARY
          elif [ "$TFSEC_RESULT" = "failure" ]; then
            echo "❌ **Security issues detected**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the security findings above and address" \
              >> $GITHUB_STEP_SUMMARY
            echo "any critical or high severity issues." \
              >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Common fixes:" >> $GITHUB_STEP_SUMMARY
            echo "- Enable encryption for storage resources" \
              >> $GITHUB_STEP_SUMMARY
            echo "- Add proper access controls and policies" \
              >> $GITHUB_STEP_SUMMARY
            echo "- Use secure defaults for network configurations" \
              >> $GITHUB_STEP_SUMMARY
            echo "- Enable logging and monitoring" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "⚠️ **Unexpected result: $TFSEC_RESULT**" \
              >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **SARIF results uploaded to GitHub Security tab**" \
            >> $GITHUB_STEP_SUMMARY
