---
name: Terraform Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  tfsec:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        run: |
          echo "🔍 Running tfsec security scan..."
          
          # Install tfsec
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          
          # Run tfsec and generate SARIF output
          tfsec . --format sarif --out tfsec-results.sarif --verbose --include-ignored || true
          
          # Check if SARIF file was created
          if [ -f "tfsec-results.sarif" ]; then
            echo "✅ SARIF file created successfully"
            ls -la tfsec-results.sarif
          else
            echo "⚠️ No SARIF file created, creating empty one for upload"
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"tfsec"}},"results":[]}]}' > tfsec-results.sarif
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif

  tfsec-pr-commenter:
    runs-on: ubuntu-latest
    name: Security Comments
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: tfsec PR commenter
        uses: aquasecurity/tfsec-pr-commenter-action@v1.3.1
        with:
          github_token: ${{ github.token }}

  summary:
    needs: [tfsec]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security Summary
        run: |
          echo "## 🔒 Terraform Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TFSEC_RESULT="${{ needs.tfsec.result }}"

          if [ "$TFSEC_RESULT" = "success" ]; then
            echo "✅ **Security scan completed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the SARIF results below for any security findings." \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security scan failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The tfsec scan encountered an error. Check the logs above." \
              >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **SARIF results uploaded to GitHub Security tab**" \
            >> $GITHUB_STEP_SUMMARY
